<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .descricao {
            color: #555;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Categorias</h1>

    <!-- LISTAGEM -->
    <div class="grid">
        {% for categoria in categorias %}
        <div class="card">
            <h2>{{ categoria.nome }}</h2>
            <p class="descricao">{{ categoria.descricao }}</p>
        </div>
        {% endfor %}
    </div>

    {% if categorias|length == 0 %}
        <div class="empty">Nenhuma categoria cadastrada.</div>
    {% endif %}

    <!-- FORMULÁRIO -->
    <form action="/categorias" method="post">
        <h2>Nova Categoria</h2>

        <input type="text" name="nome" placeholder="Nome da categoria" required>

        <input type="text" name="descricao" placeholder="Descrição" required>

        <button type="submit">Cadastrar</button>
    </form>

</div>

</body>
</html>
